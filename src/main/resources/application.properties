server.port=8080

# ── App identity ─────────────────────────────────────────────────────────────
spring.application.name=STARMAP

# ── Hiwonder GPS serial port ─────────────────────────────────────────────────
gps.serial.port=COM8
gps.serial.baud=9600
gps.simulate=true
gps.track.max-points=500
gps.sse.heartbeat-ms=1000

# ── Orekit data ───────────────────────────────────────────────────────────────
orekit.data.path=orekit-data

# ── Observer default (Mumbai, India) ─────────────────────────────────────────
observer.default.lat=19.1334
observer.default.lon=72.9133
observer.default.alt=14.0

# ── Satellite tracking ────────────────────────────────────────────────────────
# Comma-separated NORAD IDs. Supports upcoming 6-digit catalog numbers.
# FORMAT=JSON (OMM) is used — no TLE format, no Base-34 encoding issue.
sat.track.norad-ids=25544
sat.track.refresh-ms=7200000
sat.track.cache-dir=./sat-cache
sat.track.groundtrack-minutes=90
sat.track.pass-window-hours=24
sat.track.min-elevation-deg=10

# ── SSE update rate ───────────────────────────────────────────────────────────
starmap.sse.interval-ms=1000

# ── Observability ─────────────────────────────────────────────────────────────
# /actuator/health — liveness/readiness for uptime checks
# /actuator/metrics — JVM memory, request latency, etc.
# Deliberately NOT exposing "env" or "beans" publicly — those leak config
# detail that doesn't need to be internet-facing on a public deployment.
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=when-authorized

# ── Logging ───────────────────────────────────────────────────────────────────
# Tuned deliberately rather than left at Spring Boot defaults: app logs stay
# at INFO (the level this project's own debugging relied on), while Orekit
# and Spring framework internals are turned down to WARN so real signal
# doesn't get buried in framework noise on every restart.
logging.level.root=INFO
logging.level.com.starmap=INFO
logging.level.org.orekit=WARN
logging.level.org.springframework=WARN

# ── Spring ────────────────────────────────────────────────────────────────────
spring.thymeleaf.check-template-location=false
