name: Deploy to Cloud Run
on:
  push:
    branches: [main]
    paths:
      - '.dockerignore'
      - '.gitattributes'
      - '.github/workflows/deploy-cloud-run.yml'
      - 'Dockerfile'
      - 'orekit-data/**'
      - 'pom.xml'
      - 'src/**'
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGION: europe-west1
  IMAGE: europe-west1-docker.pkg.dev/maps-31544/starmap/starmap

jobs:
  deploy:
    environment:
      name: cloud-run-production
      url: https://starmap-tvyqcsjjqq-ew.a.run.app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'   # match your pom / Dockerfile
          cache: maven
          problem-matcher: true

      - run: mvn -B verify

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/370843682819/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@maps-31544.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:production" .
          docker push --all-tags "$IMAGE"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          service: starmap
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Smoke test deployed service
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail

          if [[ -z "$SERVICE_URL" ]]; then
            echo "::error::Cloud Run deploy did not return a service URL"
            exit 1
          fi

          curl --fail --silent --show-error --retry 6 --retry-all-errors \
            --retry-delay 5 --max-time 30 "$SERVICE_URL/" -o /tmp/starmap-home.html
          grep -q '<title>STARMAP' /tmp/starmap-home.html

          health="$(curl --fail --silent --show-error --retry 6 --retry-all-errors \
            --retry-delay 5 --max-time 30 "$SERVICE_URL/actuator/health")"
          python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          actual = data.get("status")
          if actual != "UP":
              raise SystemExit(f"Health endpoint status is {actual!r}")
          print("Health endpoint is UP")
          ' <<<"$health"

          status_ready=false
          for attempt in {1..12}; do
            if status="$(curl --fail --silent --show-error --max-time 30 "$SERVICE_URL/api/status")" \
              && python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          required = {"gpsSimulating", "ephemerisReady", "trackedSats", "observer"}
          missing = required - data.keys()
          sys.exit(0 if not missing and data["ephemerisReady"] is True else 1)
          ' <<<"$status"; then
              status_ready=true
              break
            fi
            sleep 5
          done

          if [[ "$status_ready" != true ]]; then
            echo "::error::Application status did not become ready after deployment"
            exit 1
          fi
          echo "Application status endpoint is ready"
