name: Create GitHub release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Validate release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION="$(python3 -c 'import xml.etree.ElementTree as ET; ns={"m":"http://maven.apache.org/POM/4.0.0"}; print(ET.parse("pom.xml").findtext("m:version", namespaces=ns))')"
          if [[ "$VERSION" != "$POM_VERSION" ]]; then
            echo "Release tag version $VERSION does not match pom.xml version $POM_VERSION." >&2
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "Refusing to release a tag that is not on main." >&2
            exit 1
          fi

      - name: Verify release
        run: mvn -B verify

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          JAR="target/starmap-${VERSION}.jar"
          SBOM="target/starmap-${VERSION}-sbom.json"
          CHECKSUMS="target/starmap-${VERSION}-checksums.txt"
          test -f "$JAR"
          cp target/classes/META-INF/sbom/application.cdx.json "$SBOM"
          (
            cd target
            sha256sum "starmap-${VERSION}.jar" "starmap-${VERSION}-sbom.json" > "starmap-${VERSION}-checksums.txt"
          )
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag "$JAR" "$SBOM" "$CHECKSUMS"
